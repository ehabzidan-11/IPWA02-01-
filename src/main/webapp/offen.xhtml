<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <title>Noch zu bergende Geisternetze</title>
    </h:head>

    <h:body>

        <h1 align="center">Noch zu bergende Geisternetze</h1>

        <h:messages style="color:red;" />

        <h:button value="Alle Geisternetze" outcome="liste" />
        <h:button value="Neues Netz melden" outcome="report" />

        <h:dataTable value="#{geisternetzListeBean.offen}"
                     var="g"
                     border="1"
                     cellpadding="6">

            <h:column>
                <f:facet name="header">ID</f:facet>
                <h:outputText value="#{g.id}" />
            </h:column>

            <h:column>
                <f:facet name="header">Breite</f:facet>
                <h:outputText value="#{g.breitengrad}" />
            </h:column>

            <h:column>
                <f:facet name="header">Länge</f:facet>
                <h:outputText value="#{g.laengengrad}" />
            </h:column>

            <h:column>
                <f:facet name="header">Größe</f:facet>
                <h:outputText value="#{g.groesse}" />
            </h:column>

            <h:column>
                <f:facet name="header">Status</f:facet>
                <h:outputText value="#{g.status}" />
            </h:column>

            <h:column>
                <f:facet name="header">Name der Person</f:facet>
                <h:outputText value="#{g.bergendePerson != null ? g.bergendePerson.name : ''}" />
            </h:column>

            <h:column>
                <f:facet name="header">Telefonnummer</f:facet>
                <h:outputText value="#{g.bergendePerson != null ? g.bergendePerson.telefon : ''}" />
            </h:column>

            <h:column>
                <f:facet name="header">Aktionen</f:facet>

                <!-- Buttons: status ändern -->
                <h:form>
                    <h:commandButton value="Geborgen" action="#{geisternetzListeBean.geborgen}">
                        <f:setPropertyActionListener target="#{geisternetzListeBean.selectedId}" value="#{g.id}" />
                    </h:commandButton>

                    <h:commandButton value="Verschollen" action="#{geisternetzListeBean.verschollen}">
                        <f:setPropertyActionListener target="#{geisternetzListeBean.selectedId}" value="#{g.id}" />
                    </h:commandButton>
                </h:form>

                <h:link value="Bergung übernehmen" outcome="bergung">
                    <f:param name="id" value="#{g.id}" />
                </h:link>

            </h:column>

        </h:dataTable>

    </h:body>
</html>
